# Oslo Apartment Hunt — scoring & filter configuration.
# Hand-edit freely. Sections marked `active: false` are written out but not
# yet applied — usually because they need detail-page enrichment (v1.0.5)
# or LLM analysis (v1.1).

# ============================================================================
# Hard filters — listings outside these ranges are EXCLUDED from the digest.
# ============================================================================
hard_filters:

  # --- v1: applied from search-results data ---

  total_price_max_nok: 15000000
  fellesutgifter_max_nok_per_month: 7000
  area_min_m2: 90
  bedrooms_min: 3
  exclude_oppussingsobjekt_in_title: true   # catches both "oppussingsobjekt" and
                                            # "renoveringsobjekt"; description-only
                                            # mentions caught in v1.0.5.

  # Location caps — three independent hard filters, AND-combined.
  # A listing passes only if it satisfies ALL three.
  # Times are now from real public-transit routing (Entur API), with a
  # Haversine × 10 km/h fallback if the API is unreachable. Cap values are
  # in real minutes.
  location_caps:
    active: true
    current_school_max_minutes: 25     # ≤25 to Skovveien 9 (current school)
    future_school_max_minutes: 33      # ≤33 to Snarøyveien 30 (future school)
    celine_commute_max_minutes: 45     # ≤45 to Freserveien 1 (Céline's work)

  # --- v1.0.5: requires detail-page fetch ---

  # Activated (high-confidence extraction):
  exclude_ground_floor:
    value: true                  # excludes floor == 1 (1. etasje = ground)
    active: true
  elevator_required_at_or_above_floor:
    value: 4                     # 4. etasje and up = elevator required
    active: true
  exclude_sold_or_under_offer:
    value: true                  # excludes ad.disposed == true
    active: true
  exclude_fixer_upper_in_description:
    value: true                  # full-description scan for the keywords above
    active: true

  # Still deferred — text-based, fuzzy, kept as ⚠️ unverified for now:
  bedroom_min_m2:
    value: 7
    active: false
  wet_rooms_min:
    value: 3                     # 2 bath + 1 toilet
    active: false
  storage_bod_required:
    value: true
    active: false                # we extract has_bod_evidence but it's heuristic
  washing_machine_required:
    value: true
    active: false                # same — keyword-based, not in structured data

  # --- v1.1: requires LLM analysis ---

  exclude_north_facing_main_rooms:
    value: true
    active: false                  # LLM main_orientation exists but too noisy
                                   # to gate hard-fail on. Stays as ⚠️ for now.
  exclude_layout_dealbreakers:
    # narrow hallways, gjennomgangsrom, kitchen no window, bath off kitchen
    value: true
    active: true                   # ACTIVE in v1.1
    min_confidence: 0.7            # only fire when LLM says yes AND
                                   # confidence ≥ this threshold
                                   # (avoids false-positive drops)

  # --- v1.x: requires routing (Entur / OSM) ---

  grocery_within_walk_minutes:
    value: 10                    # Kiwi/Coop/Meny/Rema/Bunnpris ≤ 10 min walk
    active: false


# ============================================================================
# Bucket weights (must sum to 100)
# ============================================================================
weights:
  location_and_commute: 30
  apartment: 35
  financials: 20
  building: 15


# ============================================================================
# Location & commute (30%)
# ============================================================================
location:

  # Reference point: current home, for "distance from current" info on cards.
  current_home:
    address: "Holmboes Gate 7B, Bolteløkka, Oslo"
    coordinates: { lat: 59.9249232812681, lon: 10.719758197659349 }

  # School zones — produce TAGS only, no score impact (per project spec).
  schools:
    current:
      name: "French school (current, until Sept 2028)"
      address: "Skovveien 9, Oslo"
      coordinates: { lat: 59.91705266507946, lon: 10.717338097658788 }
      good_threshold_minutes: 25
    next:
      name: "French school (from Sept 2028)"
      address: "Snarøyveien 30, Fornebu"
      coordinates: { lat: 59.89961175558525, lon: 10.627580028343047 }
      good_threshold_minutes: 25                    # for tag display only
    in_between_threshold_minutes: 30                # ≤30 min to BOTH = ⚖️

  # Céline's commute (scored).
  commute_celine:
    destination: "Freserveien 1, Oslo (Helsfyr)"
    coordinates: { lat: 59.902834797322285, lon: 10.784423197657866 }
    full_score_max_minutes: 40                      # ≤40 = full points
    partial_score_max_minutes: 45                   # 40–45 = partial

  # Quiet street (LLM-detected in v1.1).
  noisy_streets:
    active: false
    penalty: -8
    patterns: ["Ring 2", "Ring 3", "Kirkeveien", "Bogstadveien"]


# ============================================================================
# Apartment (35%) — scored from LLM analysis + Finn facilities flags.
# Active in v1.1.
# ============================================================================
apartment:
  active_in_v1: true
  outdoor_space:
    balcony_or_terrace_bonus: 10
    private_garden_bonus: 12
    park_5min_walk_bonus: 5
    bakgaard_or_park_required: true
  light_orientation:
    south_main_bonus: 8
    west_main_bonus: 5
  ceiling_height:
    min_m: 2.7
    bonus: 12
  fireplace_peis_bonus: 10
  bathtub_bonus: 4
  open_plan_kitchen_bonus: 2
  recent_renovation:
    within_years: 5
    bonus: 8
  parking_bonus: 5
  bike_storage_bonus: 3
  heating:
    collective_bonus: 4
    individual_electric_penalty: -3
  no_visavi_bonus: 5
  clean_layout_bonus: 6


# ============================================================================
# Financials (20%)
# ============================================================================
financials:
  price_per_m2:
    # v1.x: per-listing neighborhood median via K-nearest-neighbors over the
    # scraped baseline. K-NN compares listings to similar (≥3BR ≥90m²) peers
    # in the same geographic area, eliminating the suburb-bias that capped
    # us to ±15 in v1. Now scores use the full 0-100 range.
    neighborhood_k_nearest: 15
    # Score curve: 0% diff = 50, -30% = 100, +30% = 0, linear, clamped.
    # No explicit cap key — clamping is implicit.
  fellesgjeld:
    high_threshold_nok: 1000000
    high_penalty: -3


# ============================================================================
# Building (15%) — family-friendly + quiet/busy street, both LLM-detected.
# Active in v1.1.
# ============================================================================
building:
  active_in_v1: true
  family_friendly_bonus: 8
  # Inline weights for the busy/quiet street signal — see scorer.py


# ============================================================================
# Tags (no score impact, just labels in the digest)
# ============================================================================
tags:
  visning_hot_within_hours: 48
  flag_incomplete_data: true   # ⚠️ on cards we couldn't fully verify


# ============================================================================
# Voting backend (v1.1) — Google Sheets via Apps Script Web App.
# Set web_app_url after deploying apps_script/Code.gs as a Web app.
# Both partners load the digest at the same URL but with ?v=arnaud or
# ?v=celine to identify themselves. URL is technically discoverable from
# the deployed JS, so don't treat it as secret — but obscure-by-default
# is enough security for a 2-user private digest.
# ============================================================================
voting:
  active: true
  web_app_url: "https://script.google.com/macros/s/AKfycbx9kZFwc8valJhPAc9CIz1EvkYgTtOcTrKVK8hd94ppkR3n4hdV1eIXb7HkAY7F_fFgKA/exec"   # paste the Apps Script Web app URL here once deployed


# ============================================================================
# Salgsoppgave extraction (v1.2+) — fetch each listing's broker prospectus,
# extract structured facts via Claude (Haiku, cheap structured-extraction).
# Feeds the criteria checklist (bedroom sizes, wet rooms, bod, washing
# machine) and surfaces extra detail (TG ratings, renovation history,
# heating, fellesutgifter inclusions). Per project policy these are
# annotation-only — listings are NOT auto-dropped based on salgsoppgave
# data. v1.3+ may flip selected items into hard filters once the data
# proves reliable across broker variants.
# ============================================================================
salgsoppgave:
  active: true
  model: claude-haiku-4-5-20251001
  # Cost estimate: ~$0.50-1 per fresh full run, near zero with cache.


# ============================================================================
# LLM analysis (v1.1) — Claude-driven extraction of qualitative signals.
# Reads listing description + structured Norwegian fact-table sections,
# returns vibe summary, layout dealbreakers, light/orientation, etc.
# Requires ANTHROPIC_API_KEY env var (GH Actions secret in CI).
# ============================================================================
llm:
  active: true
  model: claude-sonnet-4-6           # claude-haiku-4-5-20251001 if cost matters
  temperature: 0.2                   # low — we want consistent structured output
  # Cost estimate: ~$0.20 per fresh full run, near-zero with cache hits.
