name: Daily digest

on:
  # 05:00 UTC = 07:00 Oslo (CEST, summer) / 06:00 (CET, winter).
  # The seasonal hour drift is a known v1 wart — fixable in v1.x with two
  # cron lines or a smarter scheduler.
  schedule:
    - cron: "0 5 * * *"
  # Manual one-click trigger from the Actions tab.
  workflow_dispatch: {}

# Pages deployment requires these. `contents: read` is enough since we don't
# commit anything back to the repo.
permissions:
  contents: read
  pages: write
  id-token: write

# Don't let two scheduled+manual runs overlap. Cancel-in-progress is off so
# a manual run waits for an in-flight scheduled run instead of clobbering it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Persistent cache across runs. Each run saves under a unique key
      # (run_id), restores from the most recent matching prefix.
      # Bump the version (v2 → v3 …) whenever the cache *shape* changes —
      # i.e. when an enrichment / salgsoppgave / llm field is added that
      # cached entries don't carry. This forces a full clean re-fetch on
      # the next run instead of restoring stale data.
      - name: Restore caches
        id: cache-restore
        uses: actions/cache/restore@v5
        with:
          path: .cache/
          key: scrape-cache-v3-${{ github.run_id }}
          restore-keys: |
            scrape-cache-v3-

      - name: Run pipeline
        run: python -m src.main
        env:
          PYTHONUNBUFFERED: "1"
          # Optional. If unset, the LLM analysis pass is skipped (warning
          # logged, pipeline continues with structured-data scoring only).
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Optional. If RESEND_API_KEY or both EMAIL_TO_* are unset, the
          # email digest step skips silently. The web digest is primary.
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_TO_ARNAUD: ${{ secrets.EMAIL_TO_ARNAUD }}
          EMAIL_TO_CELINE: ${{ secrets.EMAIL_TO_CELINE }}

      - name: Save caches
        if: always()
        uses: actions/cache/save@v5
        with:
          path: .cache/
          key: scrape-cache-v3-${{ github.run_id }}

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
